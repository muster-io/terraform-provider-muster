# The checks of every pull request and of master, joined in the job ci, which the ruleset of master requires. The daily
# run also reports how the copy of Muster's specification differs from Muster's master (drift), without failing.
name: ci

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never switch to another toolchain than the newest Go 1.27 that setup-go installed.
  GOTOOLCHAIN: local

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      # bin/tools keeps the tools the Makefile builds; the key changes with the Go toolchain and the tool versions.
      - name: compute the key of the Go tools
        id: tools
        run: |
          lines=$(grep -E '^[A-Z_]+_(PKG|VERSION) :=' Makefile | sha256sum | cut -c1-16)
          echo "key=go-tools-$RUNNER_OS-$RUNNER_ARCH-$GITHUB_JOB-$(go env GOVERSION)-$lines" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: ${{ steps.tools.outputs.key }}
      - run: make lint

  # The race detector and the coverage gate: 80 % of internal/, the generated client excluded.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - run: make test

  generate:
    name: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - name: compute the key of the Go tools
        id: tools
        run: |
          lines=$(grep -E '^[A-Z_]+_(PKG|VERSION) :=' Makefile | sha256sum | cut -c1-16)
          echo "key=go-tools-$RUNNER_OS-$RUNNER_ARCH-$GITHUB_JOB-$(go env GOVERSION)-$lines" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: ${{ steps.tools.outputs.key }}
      - run: make generate-check

  # api/openapi.yaml is the specification of its pin (api/MUSTER_COMMIT or api/MUSTER_VERSION), byte for byte.
  spec:
    name: spec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make spec-check

  # docs/ is what tfplugindocs makes of the schema, templates/ and examples/; tfplugindocs runs terraform.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~1.11.0'
          terraform_wrapper: false
      - name: compute the key of the Go tools
        id: tools
        run: |
          lines=$(grep -E '^[A-Z_]+_(PKG|VERSION) :=' Makefile | sha256sum | cut -c1-16)
          echo "key=go-tools-$RUNNER_OS-$RUNNER_ARCH-$GITHUB_JOB-$(go env GOVERSION)-$lines" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: ${{ steps.tools.outputs.key }}
      - run: make docs-check

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - name: compute the key of the Go tools
        id: tools
        run: |
          lines=$(grep -E '^[A-Z_]+_(PKG|VERSION) :=' Makefile | sha256sum | cut -c1-16)
          echo "key=go-tools-$RUNNER_OS-$RUNNER_ARCH-$GITHUB_JOB-$(go env GOVERSION)-$lines" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: ${{ steps.tools.outputs.key }}
      - run: make licenses

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - name: compute the key of the Go tools
        id: tools
        run: |
          lines=$(grep -E '^[A-Z_]+_(PKG|VERSION) :=' Makefile | sha256sum | cut -c1-16)
          echo "key=go-tools-$RUNNER_OS-$RUNNER_ARCH-$GITHUB_JOB-$(go env GOVERSION)-$lines" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: ${{ steps.tools.outputs.key }}
      - run: make vulncheck

  # The release build in snapshot mode, without the signature: the ten zips and SHA256SUMS, which lists the manifest
  # that a release uploads next to them.
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # renovate: datasource=github-releases depName=goreleaser/goreleaser
      GORELEASER_VERSION: v2.18.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign
      - name: check the release files
        run: |
          cat dist/*_SHA256SUMS
          grep -q '_manifest\.json$' dist/*_SHA256SUMS
          zips=$(ls dist/*.zip | wc -l)
          echo "zips: $zips"
          test "$zips" -eq 10

  # The daily report of how api/openapi.yaml differs from the specification on Muster's master: in the job's summary,
  # never a failure. Moving to it is a pull request with make spec-sync.
  drift:
    name: drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compare the copy with Muster's master
        run: |
          diff=$(make --no-print-directory spec-drift)
          {
            echo '## api/openapi.yaml against Muster'"'"'s master'
            echo
            echo '```diff'
            printf '%s\n' "$diff" | head -n 2000
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # The required check: it passes only when every job above succeeded, and fails when one failed, was cancelled or
  # was skipped.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, generate, spec, docs, licenses, vulncheck, goreleaser]
    if: ${{ always() }}
    steps:
      - name: every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null
